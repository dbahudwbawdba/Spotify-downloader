<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftHub - Spotify Downloader</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1db954, #191414);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      margin-bottom: 25px;
      opacity: 0.8;
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      font-size: 14px;
      resize: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #1db954;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #17a74a;
    }

    .result {
      margin-top: 20px;
    }

    a.download {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: white;
      color: black;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎁 GiftHub Spotify Tool</h1>
    <p>Plak hier je Spotify / code en download als MP3</p>

    <textarea id="input" placeholder="Plak hier je Spotify link of code..."></textarea>

    <button onclick="convert()">Convert & Download</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function convert() {
      const input = document.getElementById('input').value;
      const result = document.getElementById('result');

      if (!input) {
        result.innerHTML = "⚠️ Vul eerst iets in";
        return;
      }

      // ⚠️ PLACE YOUR SPOTIFY API / BACKEND HERE
      // Example fake response:
      const fakeMp3 = "https://example.com/song.mp3";

      result.innerHTML = `
        <p>✅ Klaar!</p>
        <a class="download" href="${fakeMp3}" download>Download MP3</a>
      `;
    }
  </script>
</body>
</html>
