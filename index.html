<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftHub Pro</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1db954, #0b0b0b);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar h2 {
      margin-bottom: 10px;
    }

    .tab {
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      transition: 0.2s;
    }

    .tab:hover, .tab.active {
      background: #1db954;
    }

    .add-tab {
      margin-top: auto;
      padding: 12px;
      border-radius: 10px;
      background: white;
      color: black;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 40px;
      margin: 0;
    }

    textarea {
      width: 100%;
      height: 150px;
      border-radius: 15px;
      border: none;
      padding: 15px;
      font-size: 16px;
      margin-top: 10px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary {
      background: #1db954;
      color: white;
    }

    .secondary {
      background: white;
      color: black;
    }

    button:hover { transform: scale(1.05); }

    .result {
      margin-top: 20px;
    }

    a.download {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 18px;
      background: white;
      color: black;
      border-radius: 10px;
      text-decoration: none;
    }

  </style>
</head>
<body>

<div class="app">

  <div class="sidebar">
    <h2>🎁 GiftHub</h2>
    <div id="tabs"></div>
    <div class="add-tab" onclick="addTab()">+ Nieuw tabblad</div>
  </div>

  <div class="main">
    <h1 id="title">Spotify Tool</h1>

    <div class="card">
      <label>Spotify link / code</label>
      <textarea id="input"></textarea>

      <div class="buttons">
        <button class="primary" onclick="convert()">Convert</button>
        <button class="secondary" onclick="save()">Opslaan</button>
      </div>

      <div class="result" id="result"></div>
    </div>
  </div>

</div>

<script>
  let tabs = JSON.parse(localStorage.getItem('tabs') || '[]');
  let currentTab = 0;

  function renderTabs() {
    const container = document.getElementById('tabs');
    container.innerHTML = '';

    tabs.forEach((tab, i) => {
      const el = document.createElement('div');
      el.className = 'tab' + (i === currentTab ? ' active' : '');
      el.innerText = tab.name || 'Tab ' + (i+1);
      el.onclick = () => switchTab(i);
      container.appendChild(el);
    });
  }

  function switchTab(i) {
    currentTab = i;
    document.getElementById('input').value = tabs[i].value || '';
    renderTabs();
  }

  function addTab() {
    tabs.push({ name: 'Tab ' + (tabs.length+1), value: '' });
    currentTab = tabs.length - 1;
    saveStorage();
    renderTabs();
    switchTab(currentTab);
  }

  function save() {
    if (!tabs[currentTab]) return;
    tabs[currentTab].value = document.getElementById('input').value;
    saveStorage();
    alert('Opgeslagen ✅');
  }

  function saveStorage() {
    localStorage.setItem('tabs', JSON.stringify(tabs));
  }

  function convert() {
    const input = document.getElementById('input').value;
    const result = document.getElementById('result');

    if (!input) {
      result.innerHTML = '⚠️ Vul iets in';
      return;
    }

    // PLACE BACKEND HERE
    const fakeMp3 = 'https://example.com/song.mp3';

    result.innerHTML = `
      <p>✅ Klaar</p>
      <a class="download" href="${fakeMp3}" download>Download MP3</a>
    `;
  }

  // init
  if (tabs.length === 0) addTab();
  else switchTab(0);

  renderTabs();
</script>

</body>
</html>
