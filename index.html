<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundVault</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:#0b0f0c;
  color:white;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:280px;
  background:#0f1712;
  padding:20px;
  display:flex;
  flex-direction:column;
  border-right:1px solid rgba(255,255,255,0.05);
}

.logo{
  font-size:20px;
  font-weight:700;
  margin-bottom:20px;
}

.tab{
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:8px;
  background:rgba(255,255,255,0.04);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}

.tab.active{background:#1db954}

.tab input{
  background:none;
  border:none;
  color:white;
  width:100%;
}

.add{
  margin-top:auto;
  padding:12px;
  border-radius:10px;
  background:#1db954;
  text-align:center;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:40px;
  overflow:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h1{
  font-size:36px;
}

.card{
  margin-top:20px;
  background:#121a14;
  border-radius:20px;
  padding:25px;
  border:1px solid rgba(255,255,255,0.05);
}

textarea{
  width:100%;
  height:140px;
  border-radius:12px;
  border:none;
  padding:15px;
  font-size:15px;
  margin-top:10px;
}

.row{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:#1db954;color:white}
.secondary{background:#222;color:white}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:15px;
  margin-top:20px;
}

.song{
  background:#141d16;
  padding:15px;
  border-radius:12px;
  font-size:14px;
}

.song a{
  display:block;
  margin-top:10px;
  background:white;
  color:black;
  padding:8px;
  border-radius:8px;
  text-align:center;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">🎧 SoundVault</div>
  <div id="tabs"></div>
  <div class="add" onclick="newTab()">+ Nieuwe map</div>
</div>

<div class="main">

  <div class="header">
    <h1 id="title">Dashboard</h1>
  </div>

  <div class="card">
    <label>Spotify link / code</label>
    <textarea id="input"></textarea>

    <div class="row">
      <button class="primary" onclick="convert()">Convert</button>
      <button class="secondary" onclick="save()">Opslaan</button>
    </div>
  </div>

  <div class="grid" id="library"></div>

</div>

<script>
let tabs = JSON.parse(localStorage.getItem('vault_tabs')||'[]');
let current = 0;

function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML='';

  tabs.forEach((t,i)=>{
    const div=document.createElement('div');
    div.className='tab'+(i===current?' active':'');

    const input=document.createElement('input');
    input.value=t.name;
    input.onchange=(e)=>{t.name=e.target.value;saveData();}

    div.onclick=()=>switchTab(i);
    div.appendChild(input);

    el.appendChild(div);
  });
}

function newTab(){
  const name=prompt('Naam van map:');
  if(!name) return;
  tabs.push({name,items:[],value:''});
  current=tabs.length-1;
  saveData();
  renderTabs();
  load();
}

function switchTab(i){
  current=i;
  load();
  renderTabs();
}

function load(){
  document.getElementById('title').innerText=tabs[current].name;
  document.getElementById('input').value=tabs[current].value||'';
  renderLibrary();
}

function save(){
  tabs[current].value=document.getElementById('input').value;
  saveData();
  alert('Saved');
}

function convert(){
  const val=document.getElementById('input').value;
  if(!val) return alert('geen input');

  const fake={
    name:'Track '+(tabs[current].items.length+1),
    url:'https://example.com/song.mp3'
  };

  tabs[current].items.push(fake);
  saveData();
  renderLibrary();
}

function renderLibrary(){
  const lib=document.getElementById('library');
  lib.innerHTML='';

  tabs[current].items.forEach(s=>{
    const div=document.createElement('div');
    div.className='song';
    div.innerHTML=`
      <b>${s.name}</b>
      <a href="${s.url}" download>Download</a>
    `;
    lib.appendChild(div);
  });
}

function saveData(){
  localStorage.setItem('vault_tabs',JSON.stringify(tabs));
}

if(tabs.length===0) newTab(); else {renderTabs();load();}
</script>

</body>
</html>
