<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundVault Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter;background:#0b0f0c;color:white}

.app{display:flex;height:100vh}

.sidebar{width:260px;background:#0f1712;padding:20px;display:flex;flex-direction:column}
.logo{font-weight:700;font-size:20px;margin-bottom:20px}

.folder{padding:10px;border-radius:8px;margin-bottom:6px;background:#1a241d;cursor:pointer}
.folder.active{background:#1db954}

.add{margin-top:auto;padding:10px;background:#1db954;border-radius:8px;text-align:center;cursor:pointer}

.main{flex:1;padding:40px}

.card{background:#121a14;padding:25px;border-radius:15px}

textarea{width:100%;height:120px;margin-top:10px;border-radius:10px;padding:10px;border:none}

.row{display:flex;gap:10px;margin-top:15px}
button{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer}
.primary{background:#1db954;color:white}
.secondary{background:#2a2a2a;color:white}

.grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.item{background:#18231c;padding:10px;border-radius:10px}
.item a{display:block;margin-top:8px;background:white;color:black;text-align:center;padding:6px;border-radius:6px;text-decoration:none}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#121a14;
  padding:25px;
  border-radius:15px;
  width:300px;
}

.modal select, .modal input{
  width:100%;margin-top:10px;padding:10px;border-radius:8px;border:none
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <div class="logo">🎧 SoundVault</div>
  <div id="folders"></div>
  <div class="add" onclick="openFolderModal()">+ Nieuwe map</div>
</div>

<div class="main">
  <h1 id="title"></h1>

  <div class="card">
    <label>Spotify link</label>
    <textarea id="input"></textarea>

    <div class="row">
      <button class="primary" onclick="openConvertModal()">Convert</button>
    </div>
  </div>

  <div class="grid" id="list"></div>
</div>

</div>

<!-- CREATE FOLDER MODAL -->
<div class="modal" id="folderModal">
  <div class="modal-box">
    <h3>Nieuwe map</h3>
    <input id="folderName" placeholder="Naam...">
    <div class="row">
      <button onclick="createFolder()">Maak</button>
    </div>
  </div>
</div>

<!-- CONVERT MODAL -->
<div class="modal" id="convertModal">
  <div class="modal-box">
    <h3>Download opties</h3>

    <select id="format">
      <option value="mp3">MP3</option>
      <option value="mp4">MP4</option>
    </select>

    <select id="targetFolder"></select>

    <div class="row">
      <button class="primary" onclick="doConvert()">Download</button>
      <button class="secondary" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<script>
let folders = JSON.parse(localStorage.getItem('sv_folders')||'[]');
let current = 0;

function save(){localStorage.setItem('sv_folders',JSON.stringify(folders))}

function render(){
  const f=document.getElementById('folders');
  f.innerHTML='';

  folders.forEach((x,i)=>{
    const d=document.createElement('div');
    d.className='folder'+(i===current?' active':'');
    d.innerText=x.name;
    d.onclick=()=>{current=i;render();load()};
    f.appendChild(d);
  });

  load();
}

function load(){
  if(!folders[current]) return;
  document.getElementById('title').innerText=folders[current].name;

  const list=document.getElementById('list');
  list.innerHTML='';

  folders[current].items.forEach(it=>{
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`${it.name}<a href="${it.url}" download>Download ${it.type}</a>`;
    list.appendChild(div);
  });
}

function openFolderModal(){
  document.getElementById('folderModal').style.display='flex';
}

function createFolder(){
  const name=document.getElementById('folderName').value;
  if(!name) return;
  folders.push({name,items:[]});
  current=folders.length-1;
  save();
  closeModals();
  render();
}

function openConvertModal(){
  const select=document.getElementById('targetFolder');
  select.innerHTML='';

  folders.forEach((f,i)=>{
    const o=document.createElement('option');
    o.value=i;
    o.textContent=f.name;
    select.appendChild(o);
  });

  document.getElementById('convertModal').style.display='flex';
}

function doConvert(){
  const input=document.getElementById('input').value;
  if(!input) return alert('geen link');

  const format=document.getElementById('format').value;
  const folderIndex=document.getElementById('targetFolder').value;

  const fakeUrl='https://example.com/file.'+format;

  folders[folderIndex].items.push({
    name:'Track '+(folders[folderIndex].items.length+1),
    url:fakeUrl,
    type:format
  });

  save();
  closeModals();
  render();
}

function closeModals(){
  document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
}

if(folders.length===0){folders.push({name:'Mijn muziek',items:[]});save()}
render();
</script>

</body>
</html>
